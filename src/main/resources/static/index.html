<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - Hospital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .form-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            height: fit-content;
        }
        .list-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-size: 24px;
        }
        h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        .form-group {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.1);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .delete-btn {
            width: 100%;
            padding: 8px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .delete-btn:hover {
            background: #c82333;
        }
        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .section-title {
            color: #667eea;
            font-size: 12px;
            font-weight: 600;
            margin-top: 15px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .patient-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .patient-item p {
            color: #555;
            margin: 6px 0;
            font-size: 13px;
        }
        .patient-item strong {
            color: #333;
        }
        .patient-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 8px;
        }
        .patient-id {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
        }
        .no-patients {
            color: #999;
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .list-section {
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Form Section (Left) -->
        <div class="form-section">
            <h1>🏥 Patient Registration</h1>
            <div class="message" id="message"></div>
            <form onsubmit="handleSubmit(event)">
                <!-- Personal Information -->
                <div class="section-title">Personal Information</div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="id">Patient ID:</label>
                        <input type="text" id="id" required>
                    </div>
                    <div class="form-group">
                        <label for="name">Full Name:</label>
                        <input type="text" id="name" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">Gender:</label>
                        <select id="gender" required>
                            <option value="">-- Select Gender --</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="bloodGroup">Blood Group:</label>
                        <select id="bloodGroup" required>
                            <option value="">-- Select Blood Group --</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" required>
                    </div>
                </div>

                <!-- Address Information -->
                <div class="section-title">Address Information</div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="street">Street:</label>
                        <input type="text" id="street" required>
                    </div>
                    <div class="form-group">
                        <label for="city">City:</label>
                        <input type="text" id="city" required>
                    </div>
                </div>

                <button type="submit">Register Patient</button>
            </form>
        </div>

        <!-- List Section (Right) -->
        <div class="list-section">
            <h2>📋 Registered Patients</h2>
            <div id="patientsList"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/api/persons';

        async function handleSubmit(event) {
            event.preventDefault();
            const messageDiv = document.getElementById('message');
            
            try {
                const requestBody = {
                    id: document.getElementById('id').value,
                    name: document.getElementById('name').value,
                    gender: document.getElementById('gender').value,
                    bloodGroup: document.getElementById('bloodGroup').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    street: document.getElementById('street').value,
                    city: document.getElementById('city').value
                };
                
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                const responseData = await response.json();

                if (response.ok) {
                    messageDiv.textContent = '✓ Patient registered successfully!';
                    messageDiv.className = 'message success';
                    document.querySelector('form').reset();
                    loadPatients();
                } else {
                    const errorMsg = responseData.error || 'Failed to register patient';
                    messageDiv.textContent = '✗ Error: ' + errorMsg;
                    messageDiv.className = 'message error';
                }
            } catch (error) {
                messageDiv.textContent = '✗ Error: ' + error.message;
                messageDiv.className = 'message error';
            }
        }

        async function deletePatient(patientId) {
            if (!confirm('Are you sure you want to delete this patient?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/${patientId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadPatients();
                } else {
                    alert('Failed to delete patient');
                }
            } catch (error) {
                alert('Error deleting patient: ' + error.message);
            }
        }

        async function loadPatients() {
            try {
                const response = await fetch(API_BASE);
                const patients = await response.json();
                const patientsList = document.getElementById('patientsList');
                
                if (patients.length === 0) {
                    patientsList.innerHTML = '<div class="no-patients">No patients registered yet</div>';
                    return;
                }

                patientsList.innerHTML = patients.map(patient => `
                    <div class="patient-item">
                        <div class="patient-header">
                            <span class="patient-id">ID: ${patient.id}</span>
                            <button class="delete-btn" onclick="deletePatient('${patient.id}')">🗑️ Delete</button>
                        </div>
                        <p><strong>Name:</strong> ${patient.name}</p>
                        <p><strong>Gender:</strong> ${patient.gender}</p>
                        <p><strong>Blood Group:</strong> ${patient.bloodGroup}</p>
                        <p><strong>Email:</strong> ${patient.email}</p>
                        <p><strong>Phone:</strong> ${patient.phone}</p>
                        <p><strong>Address:</strong> ${patient.address.street || patient.address.line1}, ${patient.address.city}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading patients:', error);
            }
        }

        // Load patients on page load
        loadPatients();
        setInterval(loadPatients, 2000);
    </script>
</body>
</html>
